# Split `dev` do dataset de avaliação — banco de perguntas do Cantábria.
#
# Fonte: data/eval/cases.md (blocos A–I) + armadilhas de agregação e topologia
# temporal do checklist §4. Perguntas em pt-BR; plano esperado montado com os
# ids do catálogo v3. `expected_result_ref` aponta para um caso congelado do
# oráculo independente (`data/oracle/oracle_v1.yaml`); quando ausente, a camada
# `engine` usa o `compute_expected` do fixture `parity-tiny-v1` se o plano
# couber nele.
#
# O split `test` é held-out: não entra em ajuste de prompt e exige aprovação
# humana (data/eval/test.yaml protegido por hook).
#
# Convenções de período:
#   SNAP_AUG26 2026-08-31 · TOTAL_12M 2025-09-01..2026-08-31 (grain total)
#   P3M jun–ago/26 · P6M mar–ago/26 · P12M set/25–ago/26 · Q26 2026 em quarter
#   Y25/Y26 total jan–ago de cada ano (variação exige resultado colapsado).

version: 1
split: dev

cases:
  # ======================================================================
  # Bloco A — recorte único (sanity do motor)
  # ======================================================================
  - id: DEV-A01
    category: sanity
    split: dev
    language: pt
    question: "Qual a rentabilidade do Varejo PF em agosto/2026?"
    expected_behavior: answer
    expected_route: analytical
    expected_refusal_reason: null
    expected_plan:
      - rule_id: profitability
        subjects: [{type: customer_segmentation, level: segment}]
        sample: []
        period: {start: "2026-08-31", end: "2026-08-31", type: snapshot, grain: month}
    expected_methods: [null]
    expected_operations: []
    expected_result_ref: null
    severity: high
    demo: true
    fixtures: {seed: 42, dataset: parity-tiny-v1}
    definitions_ref: "cases.md A1"
    notes: "A quebra por segmento devolve a linha do Varejo PF; recorte não repete quebra."

  - id: DEV-A02
    category: aggregation_trap
    split: dev
    language: pt
    question: "Qual a rentabilidade média por segmento no último trimestre?"
    expected_behavior: not_expressible
    expected_route: refuse
    expected_refusal_reason: not_expressible
    expected_plan: null
    expected_methods: []
    expected_operations: []
    expected_result_ref: null
    severity: high
    demo: true
    fixtures: {seed: 42, dataset: parity-tiny-v1}
    definitions_ref: "definitions.md — weighting; AGENTS.md (mean proibido em profitability)"
    notes: >
      Armadilha de média de taxas: a média das taxas mensais não é a taxa da
      janela. O contrato vigente recusa `mean` em `profitability`; a leitura
      correta é re-derivar Σmargem ÷ Σsaldo no grão (grain: total, method:
      null). O cases.md A2 pedia `mean` — superado pelo contrato atual.

